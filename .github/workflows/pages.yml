name: Publica en GitHub Pages

# Pages sirve la rama gh-pages (auto-activada al crearse la rama); este
# workflow la sincroniza con main en cada push, así publicar = mergear a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sincroniza gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publica main en gh-pages
        run: git push origin HEAD:gh-pages --force
